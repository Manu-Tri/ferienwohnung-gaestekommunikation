document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nturen und Co-Hosts<\u002Fspan>\n<h4 style=\"margin:0;font:800 clamp(20px,2vw,24px) 'Bricolage Grotesque';hyphens:auto;overflow-wrap:break-word\" lang=\"de\">White Label<\u002Fh4>\n<p style=\"margin:0;font:700 18px Figtree\">auf Anfrage<\u002Fp>\n<ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font:400 16px/1.45 Figtree;color:#d9d2c3;flex:1\"><li>✓ Wir antworten in Ihrem Namen<\u002Fli><li>✓ Für viele Wohnungen gleichzeitig<\u002Fli><li>✓ Ihre Gäste sehen nur Ihre Marke<\u002Fli><\u002Ful>\n<a href=\"#anfrage\" sc-camel-on-click=\"{{ pickAgentur }}\" style=\"text-align:center;background:#f3ede1;color:#18261c;font:700 17px Figtree;padding:15px;border-radius:14px;text-decoration:none\">Gespräch anfragen<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"anfrage\" data-screen-label=\"Anfrage\" style=\"max-width:1280px;margin:0 auto;box-sizing:border-box;padding:clamp(56px,8vw,112px) clamp(20px,5vw,64px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:clamp(28px,5vw,72px);align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<p style=\"margin:0;align-self:flex-start;font:700 14px Figtree;background:#e2d6bf;padding:7px 13px;border-radius:999px\">Anfrage in 2 Minuten<\u002Fp>\n<h2 style=\"margin:0;font:800 clamp(32px,4.4vw,60px)/.98 'Bricolage Grotesque';letter-spacing:-.03em;text-wrap:balance\">Lassen Sie uns <span style=\"color:#2f7a4a\">loslegen.<\u002Fspan><\u002Fh2>\n<p style=\"margin:0;font:400 clamp(16px,1.5vw,19px)/1.55 Figtree;color:#3f4a42;max-width:480px\">Wir melden uns innerhalb eines Werktags persönlich bei Ihnen. Unverbindlich und ohne Vertrag.<\u002Fp>\n<p style=\"margin:0;font:600 clamp(20px,2vw,26px) Caveat;color:#2f7a4a\">Wir freuen uns auf Sie!<\u002Fp>\n<\u002Fdiv>\n<form sc-camel-on-submit=\"{{ submit }}\" style=\"background:#fff;border-radius:28px;padding:clamp(22px,3vw,40px);display:flex;flex-direction:column;gap:20px;box-shadow:0 20px 50px rgba(24,38,28,.08)\">\n<sc-if value=\"{{ notDone }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;flex-direction:column;gap:20px\">\n<div style=\"display:flex;align-items:center;gap:10px\"><div style=\"flex:1;height:6px;border-radius:3px;background:#e2d6bf;overflow:hidden\"><div style=\"height:100%;width:{{ progress }};background:#2f7a4a;transition:width .3s\"><\u002Fdiv><\u002Fdiv><span style=\"font:600 14px Figtree;color:#3f4a42;white-space:nowrap\">Schritt {{ stepNum }} von 3<\u002Fspan><\u002Fdiv>\n<fieldset style=\"border:0;margin:0;padding:0;display:{{ s1 }};flex-direction:column;gap:14px\">\n<legend style=\"font:700 20px 'Bricolage Grotesque';margin-bottom:12px\">Was wünschen Sie sich?<\u002Flegend>\n<label style=\"display:flex;gap:12px;align-items:center;border:2px solid {{ bPflege }};border-radius:14px;padding:14px 16px;cursor:pointer;font:600 16px Figtree\"><input type=\"radio\" name=\"paket\" value=\"pflege\" checked=\"{{ isPflege }}\" sc-camel-on-change=\"{{ pickPflege }}\" style=\"width:20px;height:20px;accent-color:#2f7a4a\">Gästekommunikation, 30 Tage kostenlos<\u002Flabel>\n<label style=\"display:flex;gap:12px;align-items:center;border:2px solid {{ bCheck }};border-radius:14px;padding:14px 16px;cursor:pointer;font:600 16px Figtree\"><input type=\"radio\" name=\"paket\" value=\"check\" checked=\"{{ isCheck }}\" sc-camel-on-change=\"{{ pickCheck }}\" style=\"width:20px;height:20px;accent-color:#2f7a4a\">Kostenloser Inserats-Check<\u002Flabel>\n<label style=\"display:flex;gap:12px;align-items:center;border:2px solid {{ bAgentur }};border-radius:14px;padding:14px 16px;cursor:pointer;font:600 16px Figtree\"><input type=\"radio\" name=\"paket\" value=\"agentur\" checked=\"{{ isAgentur }}\" sc-camel-on-change=\"{{ pickAgentur }}\" style=\"width:20px;height:20px;accent-color:#2f7a4a\">White Label für Agenturen<\u002Flabel>\n<\u002Ffieldset>\n<fieldset style=\"border:0;margin:0;padding:0;display:{{ s2 }};flex-direction:column;gap:16px\">\n<legend style=\"font:700 20px 'Bricolage Grotesque';margin-bottom:12px\">Ihre Ferienwohnungen<\u002Flegend>\n<label style=\"display:flex;flex-direction:column;gap:6px;font:600 15px Figtree\">Wie viele Wohnungen?<sc-raw-select name=\"anzahl\" style=\"border:2px solid #d9cfbb;border-radius:12px;padding:13px 14px;font:500 16px Figtree;background:#fff;color:#18261c\"><option>1<\u002Foption><option>2 bis 3<\u002Foption><option>4 bis 10<\u002Foption><option>mehr als 10<\u002Foption><\u002Fsc-raw-select><\u002Flabel>\n<div style=\"display:flex;flex-direction:column;gap:8px;font:600 15px Figtree\">Wo vermieten Sie?<div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n<label style=\"display:flex;gap:8px;align-items:center;border:2px solid #d9cfbb;border-radius:999px;padding:9px 14px;font:500 15px Figtree;cursor:pointer\"><input type=\"checkbox\" name=\"plattform\" value=\"airbnb\" style=\"accent-color:#2f7a4a;width:18px;height:18px\">Airbnb<\u002Flabel>\n<label style=\"display:flex;gap:8px;align-items:center;border:2px solid #d9cfbb;border-radius:999px;padding:9px 14px;font:500 15px Figtree;cursor:pointer\"><input type=\"checkbox\" name=\"plattform\" value=\"booking\" style=\"accent-color:#2f7a4a;width:18px;height:18px\">Booking.com<\u002Flabel>\n<label style=\"display:flex;gap:8px;align-items:center;border:2px solid #d9cfbb;border-radius:999px;padding:9px 14px;font:500 15px Figtree;cursor:pointer\"><input type=\"checkbox\" name=\"plattform\" value=\"andere\" style=\"accent-color:#2f7a4a;width:18px;height:18px\">Andere<\u002Flabel>\n<\u002Fdiv><\u002Fdiv>\n<label style=\"display:flex;flex-direction:column;gap:6px;font:600 15px Figtree\">Ort oder Region<input name=\"region\" placeholder=\"z. B. Bernkastel-Kues\" style=\"border:2px solid #d9cfbb;border-radius:12px;padding:13px 14px;font:500 16px Figtree\"><\u002Flabel>\n<\u002Ffieldset>\n<fieldset style=\"border:0;margin:0;padding:0;display:{{ s3 }};flex-direction:column;gap:16px\">\n<legend style=\"font:700 20px 'Bricolage Grotesque';margin-bottom:12px\">Wie erreichen wir Sie?<\u002Flegend>\n<label style=\"display:flex;flex-direction:column;gap:6px;font:600 15px Figtree\">Name<input name=\"name\" autocomplete=\"name\" style=\"border:2px solid #d9cfbb;border-radius:12px;padding:13px 14px;font:500 16px Figtree\"><\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:6px;font:600 15px Figtree\">E-Mail<input name=\"email\" type=\"email\" autocomplete=\"email\" style=\"border:2px solid #d9cfbb;border-radius:12px;padding:13px 14px;font:500 16px Figtree\"><\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:6px;font:600 15px Figtree\">Telefon (freiwillig)<input name=\"telefon\" type=\"tel\" autocomplete=\"tel\" style=\"border:2px solid #d9cfbb;border-radius:12px;padding:13px 14px;font:500 16px Figtree\"><\u002Flabel>\n<\u002Ffieldset>\n<div style=\"display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap\">\n<sc-if value=\"{{ canBack }}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" sc-camel-on-click=\"{{ back }}\" style=\"background:none;border:0;font:700 16px Figtree;color:#18261c;text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:12px 0\">Zurück<\u002Fbutton><\u002Fsc-if>\n<button type=\"submit\" style=\"margin-left:auto;background:#2f7a4a;color:#fff;border:0;font:700 17px Figtree;padding:16px 28px;border-radius:14px;box-shadow:0 4px 0 #1d5233;cursor:pointer\" style-hover=\"background:#286b40\">{{ nextLabel }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ done }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:12px;padding:20px 0;text-align:center;align-items:center\">\n<span style=\"width:56px;height:56px;border-radius:16px 16px 16px 4px;background:#2f7a4a;color:#fff;display:flex;align-items:center;justify-content:center;font:700 28px Figtree\">✓<\u002Fspan>\n<h3 style=\"margin:0;font:800 28px 'Bricolage Grotesque'\">Danke! Wir melden uns.<\u002Fh3>\n<p style=\"margin:0;font:400 17px/1.5 Figtree;color:#3f4a42;max-width:380px\">Innerhalb eines Werktags hören Sie persönlich von uns. Bis dahin: schönen Feierabend.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fform>\n<\u002Fsection>\n\n<section id=\"faq\" data-screen-label=\"FAQ\" style=\"max-width:960px;margin:0 auto;box-sizing:border-box;padding:0 clamp(20px,5vw,64px) clamp(56px,8vw,112px);display:flex;flex-direction:column;gap:clamp(24px,3vw,40px)\">\n<h2 style=\"margin:0;font:800 clamp(32px,4.4vw,60px)/.98 'Bricolage Grotesque';letter-spacing:-.03em\">Häufige Fragen<\u002Fh2>\n<div style=\"display:flex;flex-direction:column;border-top:2px solid #18261c\">\n<details style=\"border-bottom:1.5px solid #c9bda4\"><summary style=\"list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:16px;padding:22px 0;font:700 clamp(17px,1.6vw,20px) 'Bricolage Grotesque'\">Wer antwortet meinen Gästen?<span aria-hidden=\"true\" style=\"color:#2f7a4a;font-size:24px;line-height:1\">+<\u002Fspan><\u002Fsummary><p style=\"margin:0 0 22px;font:400 17px/1.55 Figtree;color:#3f4a42;max-width:720px\">Eine KI schreibt Entwürfe in Ihrem Ton. Alles Wichtige, also Geld, Stornierungen, Beschwerden und Notfälle, prüft ein Mensch, bevor es rausgeht.<\u002Fp><\u002Fdetails>\n<details style=\"border-bottom:1.5px solid #c9bda4\"><summary style=\"list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:16px;padding:22px 0;font:700 clamp(17px,1.6vw,20px) 'Bricolage Grotesque'\">Was kostet das?<span aria-hidden=\"true\" style=\"color:#2f7a4a;font-size:24px;line-height:1\">+<\u002Fspan><\u002Fsummary><p style=\"margin:0 0 22px;font:400 17px/1.55 Figtree;color:#3f4a42;max-width:720px\">9 € pro Buchung. Keine Grundgebühr, monatlich kündbar. Die ersten 30 Tage sind kostenlos.<\u002Fp><\u002Fdetails>\n<details style=\"border-bottom:1.5px solid #c9bda4\"><summary style=\"list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:16px;padding:22px 0;font:700 clamp(17px,1.6vw,20px) 'Bricolage Grotesque'\">Wann sind Sie erreichbar?<span aria-hidden=\"true\" style=\"color:#2f7a4a;font-size:24px;line-height:1\">+<\u002Fspan><\u002Fsummary><p style=\"margin:0 0 22px;font:400 17px/1.55 Figtree;color:#3f4a42;max-width:720px\">Täglich von 7 bis 23 Uhr, auch am Wochenende. Wir antworten in etwa 15 Minuten. [Regelung für Nachrichten zwischen 23 und 7 Uhr ergänzen]<\u002Fp><\u002Fdetails>\n<details style=\"border-bottom:1.5px solid #c9bda4\"><summary style=\"list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:16px;padding:22px 0;font:700 clamp(17px,1.6vw,20px) 'Bricolage Grotesque'\">Brauche ich dafür Technik-Kenntnisse?<span aria-hidden=\"true\" style=\"color:#2f7a4a;font-size:24px;line-height:1\">+<\u002Fspan><\u002Fsummary><p style=\"margin:0 0 22px;font:400 17px/1.55 Figtree;color:#3f4a42;max-width:720px\">Nein. Wir richten alles gemeinsam mit Ihnen ein und fragen nur, was wir über Ihre Wohnung wissen müssen.<\u002Fp><\u002Fdetails>\n<details style=\"border-bottom:1.5px solid #c9bda4\"><summary style=\"list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:16px;padding:22px 0;font:700 clamp(17px,1.6vw,20px) 'Bricolage Grotesque'\">Was passiert mit den Daten meiner Gäste?<span aria-hidden=\"true\" style=\"color:#2f7a4a;font-size:24px;line-height:1\">+<\u002Fspan><\u002Fsummary><p style=\"margin:0 0 22px;font:400 17px/1.55 Figtree;color:#3f4a42;max-width:720px\">Wir arbeiten DSGVO-konform. [Details zu Auftragsverarbeitung und Serverstandort ergänzen]<\u002Fp><\u002Fdetails>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Abschluss\" style=\"background:#18261c;color:#f3ede1\">\n<div style=\"max-width:1280px;margin:0 auto;box-sizing:border-box;padding:clamp(64px,9vw,128px) clamp(20px,5vw,64px);display:flex;flex-direction:column;gap:clamp(20px,3vw,32px);align-items:flex-start\">\n<p style=\"margin:0;font:600 clamp(20px,2.2vw,28px) Caveat;color:#f7d79a\">Heute Abend schon?<\u002Fp>\n<h2 style=\"margin:0;font:800 clamp(40px,6.4vw,96px)/.92 'Bricolage Grotesque';letter-spacing:-.04em;max-width:1000px;text-wrap:balance\">Ihre Gäste sind gut betreut. <span style=\"color:#8fd3a5\">Machen Sie Feierabend.<\u002Fspan><\u002Fh2>\n<div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px\">\n<a href=\"#anfrage\" sc-camel-on-click=\"{{ pickPflege }}\" style=\"background:#8fd3a5;color:#18261c;font:700 18px Figtree;padding:18px 30px;border-radius:14px;box-shadow:0 4px 0 #4f9a68;text-decoration:none\">30 Tage kostenlos testen<\u002Fa>\n<a href=\"#anfrage\" sc-camel-on-click=\"{{ pickCheck }}\" style=\"font:700 17px Figtree;color:#f3ede1;text-underline-offset:5px;text-decoration-thickness:2px\">Kostenlosen Inserats-Check anfordern<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fmain>\n\n<footer style=\"background:#18261c;color:#bdb6a8;border-top:1px solid rgba(243,238,228,.12)\">\n<div style=\"max-width:1280px;margin:0 auto;box-sizing:border-box;padding:28px clamp(20px,5vw,64px) {{ footPad }};display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;font:500 15px Figtree\">\n<span style=\"display:flex;align-items:center;gap:8px;color:#f3ede1;font:800 18px 'Bricolage Grotesque'\"><span style=\"width:22px;height:22px;border-radius:7px 7px 7px 2px;background:#2f7a4a;display:flex;align-items:center;justify-content:center;color:#fff;font:700 12px Figtree\">✓<\u002Fspan>anytime<\u002Fspan>\n<a href=\"/mosel\" style=\"color:#bdb6a8\">Ferienwohnungen an der Mosel<\u002Fa>\n<a href=\"/inserats-check\" style=\"color:#bdb6a8\">Inserats-Check<\u002Fa>\n<a href=\"#agenturen\" style=\"color:#bdb6a8\">Für Agenturen<\u002Fa>\n<span style=\"flex:1\"><\u002Fspan>\n<a href=\"/impressum\" style=\"color:#bdb6a8\">Impressum<\u002Fa>\n<a href=\"/datenschutz\" style=\"color:#bdb6a8\">Datenschutz<\u002Fa>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<sc-if value=\"{{ showSticky }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(243,237,225,.96);backdrop-filter:blur(8px);border-top:1px solid #d9cfbb;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center\">\n<a href=\"#anfrage\" sc-camel-on-click=\"{{ pickPflege }}\" style=\"flex:1;text-align:center;background:#2f7a4a;color:#fff;font:700 16px Figtree;padding:14px;border-radius:12px;text-decoration:none\">30 Tage kostenlos testen<\u002Fa>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;headline&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Wir antworten Ihren Gästen. Sie haben frei.&quot;,&quot;Ihre Gäste bekommen Antwort. Sie bekommen Feierabend.&quot;,&quot;Ihre Ferienwohnung ist gut betreut. Ihre Freizeit gehört wieder Ihnen.&quot;],&quot;default&quot;:&quot;Wir antworten Ihren Gästen. Sie haben frei.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;animate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;loop&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { wide: true, step: 4, n: 8, pkg: 'pflege', formStep: 1, done: false, scrolled: false };\n  rootRef = React.createRef();\n  componentDidMount() {\n    const el = this.rootRef.current;\n    if (el) {\n      this.ro = new ResizeObserver(() => {\n        const w = el.clientWidth, wide = w >= 860;\n        this.setState({ wide, w });\n      });\n      this.ro.observe(el);\n    }\n    this.onScroll = () => { const s = window.scrollY > 560; if (s !== this.state.scrolled) this.setState({ scrolled: s }); };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (!reduce && this.props.animate !== false) this.play();\n  }\n  componentWillUnmount() { this.ro && this.ro.disconnect(); clearTimeout(this.t); window.removeEventListener('scroll', this.onScroll); }\n  play() {\n    const seq = [[0, 700], [1, 1800], [2, 700], [3, 1300], [4, 5000]];\n    let i = 0;\n    const next = () => {\n      const [step, wait] = seq[i];\n      this.setState({ step });\n      i++;\n      if (i < seq.length) this.t = setTimeout(next, wait);\n      else if (this.props.loop ?? true) { i = 0; this.t = setTimeout(next, wait); }\n    };\n    next();\n  }\n  pick(pkg) { this.setState({ pkg, formStep: 1, done: false }); }\n  renderVals() {\n    const { wide, step, n, pkg, formStep, done, scrolled } = this.state;\n    const h = this.props.headline ?? 'Wir antworten Ihren Gästen. Sie haben frei.';\n    const dot = d => React.createElement('span', { key: d, style: { width: 7, height: 7, borderRadius: 4, background: '#f3ede1', display: 'inline-block', animation: `dot 1.1s ${d * 0.15}s infinite` } });\n    const sel = '3px solid #f7d79a', on = id => pkg === id;\n    return {\n      rootRef: this.rootRef,\n      cols: wide ? 'minmax(0,1fr) minmax(340px,37%)' : 'minmax(0,1fr)',\n      areas: wide ? '\"t g\" \"c g\"' : '\"t\" \"g\" \"c\"',\n      gMargin: wide ? '0 0 clamp(32px,4.5vw,64px) 0' : '16px 0 0 28px',\n      gRadius: wide ? 'clamp(120px,13vw,200px) 0 0 clamp(120px,13vw,200px)' : '90px 0 0 90px',\n      gPad: wide ? 'clamp(80px,9vw,130px) clamp(20px,2.6vw,36px) clamp(80px,9vw,130px) clamp(36px,4vw,56px)' : '18px 20px 44px 28px',\n      h1: h.startsWith('Wir'), h2: h.startsWith('Ihre Gäste'), h3: h.startsWith('Ihre Ferien'),\n      typing: React.createElement('span', { style: { display: 'inline-flex', gap: 5, background: '#18261c', padding: '12px 14px', borderRadius: '16px 16px 4px 16px' } }, [0, 1, 2].map(dot)),\n      typingOp: step === 1 ? 1 : 0,\n      ansOp: step >= 2 ? 1 : 0, ansTf: step >= 2 ? 'none' : 'translateY(8px)',\n      chkOp: step >= 3 ? 1 : 0,\n      thxOp: step >= 4 ? 1 : 0, thxTf: step >= 4 ? 'none' : 'translateY(8px)',\n      n, cost: n * 9, setN: e => this.setState({ n: +e.target.value }),\n      pickPflege: () => this.pick('pflege'), pickCheck: () => this.pick('check'), pickAgentur: () => this.pick('agentur'),\n      oPflege: on('pflege') ? sel : 'none', oCheck: on('check') ? sel : 'none', oAgentur: on('agentur') ? sel : 'none',\n      isPflege: on('pflege'), isCheck: on('check'), isAgentur: on('agentur'),\n      bPflege: on('pflege') ? '#2f7a4a' : '#d9cfbb', bCheck: on('check') ? '#2f7a4a' : '#d9cfbb', bAgentur: on('agentur') ? '#2f7a4a' : '#d9cfbb',\n      stepNum: formStep, progress: (formStep / 3 * 100) + '%',\n      s1: formStep === 1 ? 'flex' : 'none', s2: formStep === 2 ? 'flex' : 'none', s3: formStep === 3 ? 'flex' : 'none',\n      canBack: formStep > 1, back: () => this.setState({ formStep: formStep - 1 }),\n      nextLabel: formStep < 3 ? 'Weiter' : 'Anfrage senden',\n      submit: e => { e.preventDefault(); if (formStep < 3) this.setState({ formStep: formStep + 1 }); else this.setState({ done: true }); },\n      done, notDone: !done,\n      showSticky: !wide && scrolled,\n      footPad: !wide ? '96px' : '28px',\n      probCols: (this.state.w ?? 1280) >= 1000 ? 'repeat(4,minmax(0,1fr))' : (this.state.w ?? 1280) >= 520 ? 'repeat(2,minmax(0,1fr))' : 'minmax(0,1fr)'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Vorübergehend: Produktion trotz offener Platzhalter veröffentlichen (siehe "npm run platzhalter").
# Sobald alle Platzhalter ausgefüllt sind, diesen Block löschen, dann sperrt der Build wieder.
[context.production.environment]
  PLATZHALTER_ERLAUBT = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Erzeugen mit: npm run infomappe
#   -> public/anytime-infomappe.pdf (auch auf der Website abrufbar)
#   -> vorlagen/email-infomappe.txt (Text zum Kopieren in Ihr E-Mail-Programm)
# Leistungen, Ablauf, Preise und Steckbrief kommen automatisch aus dieser Datei.

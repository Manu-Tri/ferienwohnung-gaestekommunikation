# =====================================================================
# ZENTRALE INHALTSDATEI
# Hier stehen alle Texte, Preise, Zeiten und Links der Website.
#
# So ändern Sie Inhalte:
# 1. Text zwischen den Anführungszeichen ändern. Einrückung (Leerzeichen
#    am Zeilenanfang) bitte genau so lassen.
# 2. Speichern. Beim nächsten Build (oder automatisch auf Netlify)
#    ist die Änderung online. Ist die Datei fehlerhaft, bricht der Build
#    mit einer verständlichen Meldung ab und die alte Seite bleibt online.
#
# Variablen in geschweiften Klammern werden automatisch ersetzt:
#   {marke} {preis} {start} {ende} {antwortzeit} {test_tage}
#   {gp_preis} {gp_monate} {gp_plaetze} {check_stunden}
#   {verbesserungen} {region} {email} {antwort_frist}
# Wenn Sie also unten den Preis ändern, ändert er sich überall.
#
# Eckige Klammern wie [MARKENNAME] sind offene Platzhalter.
# Liste aller offenen Platzhalter: im Terminal "npm run platzhalter".
#
# Bitte keine Gedankenstriche verwenden. Prüfung: "npm run pruefen:striche".
# =====================================================================

marke:
  name: "anytime"
  # Vollständige Adresse der Website, ohne Schrägstrich am Ende
  domain: "https://www.example.de"
  email: "[E-MAIL-ADRESSE]"
  telefon: "[TELEFONNUMMER]"
  ort: "[ORT]"
  # Region, die auf der Startseite genannt wird
  region: "[REGION, z. B. Mosel, Eifel, Nordsee]"
  # Regionen für Suchmaschinen (strukturierte Daten "areaServed")
  einsatzgebiet:
    - "Deutschland"

service:
  start_uhr: 7
  ende_uhr: 23
  antwortzeit_minuten: 15
  # Wie schnell melden Sie sich nach einer Testanfrage?
  antwort_frist: "[24 Stunden]"

preise:
  pro_buchung: 9
  test_tage: 30
  gruenderpreis:
    pro_buchung: 6
    monate: 12
    plaetze_gesamt: 10
    # Freie Plätze. Nur von Hand pflegen. Leer lassen = kein Zähler sichtbar.
    # Beispiel:  plaetze_frei: 7
    plaetze_frei:
    erinnerung_vorher: "[4 Wochen]"

lead_magnet:
  check_stunden: 48
  verbesserungen: 5

links:
  # Link zur Terminbuchung (z. B. Cal.com, Calendly). Wird nur als Link geöffnet.
  buchungslink: "[BUCHUNGSLINK]"
  buchungsanbieter: "[ANBIETER DER TERMINBUCHUNG]"

formular:
  # "netlify" = Netlify Forms (Standard). "extern" = anderer Formulardienst,
  # dann unten die Adresse eintragen, an die das Formular gesendet wird.
  anbieter: "netlify"
  endpunkt: ""
  name: "anfrage"

analytics:
  # true = cookieloses Plausible einbinden. Absatz in der Datenschutz-
  # erklärung erscheint dann automatisch.
  plausible: false
  plausible_domain: "www.example.de"

seo:
  titel: "Gästebetreuung für Ferienwohnungen, {start} bis {ende} Uhr | {marke}"
  beschreibung: "Wir beantworten alle Gästenachrichten auf Airbnb und Booking.com von {start} bis {ende} Uhr. {preis} € pro Buchung, ohne Grundgebühr, {test_tage} Tage kostenlos testen."

# ---------------------------------------------------------------------
# TEXTE DER STARTSEITE (von oben nach unten)
# ---------------------------------------------------------------------

navigation:
  - { text: "So funktioniert's", ziel: "#ablauf" }
  - { text: "Preise", ziel: "#preise" }
  - { text: "Inserats-Check", ziel: "#angebote" }
  - { text: "Für Agenturen", ziel: "#agenturen" }
  - { text: "FAQ", ziel: "#faq" }

cta:
  test: "{test_tage} Tage kostenlos testen"
  test_kurz: "Kostenlos testen"
  check: "Kostenlosen Inserats-Check anfordern"
  check_kurz: "Inserats-Check"

hero:
  # Kleine Zeile über der Überschrift: sagt in 3 Sekunden, was Sie anbieten
  kicker: "Für Vermieter von Ferienwohnungen"
  # Der Satz nach dem ersten Punkt wird grün hervorgehoben.
  # Weitere Varianten aus dem Entwurf:
  #   "Ihre Gäste bekommen Antwort. Sie bekommen Feierabend."
  #   "Ihre Ferienwohnung ist gut betreut. Ihre Freizeit gehört wieder Ihnen."
  titel: "Wir antworten Ihren Gästen. Sie haben frei."
  unterzeile: "Alle Nachrichten auf Airbnb und Booking.com, von der Anfrage bis zur Bewertung. Täglich {start} bis {ende} Uhr, Antwort in etwa {antwortzeit} Minuten. Alles Wichtige prüft ein Mensch."
  vertrauen:
    - "Keine Grundgebühr"
    - "Monatlich kündbar"
    - "DSGVO-konform"
    - "Menschen kontrollieren die KI"

# Laufendes Band unter dem ersten Bildschirm. Punkte laufen endlos von rechts nach links.
laufband:
  punkte:
    - "Immer erreichbar"
    - "Auch sonntags und an Feiertagen"
    - "KI-unterstützt"
    - "Herzliche Antworten in Ihrem Ton"
    - "Keine Grundgebühr"
    - "Monatlich kündbar"
    - "{test_tage} Tage kostenlos testen"

# Kleines Gespräch im grünen Feld oben rechts. Ohne JavaScript ist alles sofort sichtbar.
chat_demo:
  uhrzeit: "21:47"
  # Handschriftliche Notiz neben der Uhrzeit
  notiz: "Sie sitzen gerade beim Abendessen."
  # Für Screenreader: beschreibt das Bild in einem Satz
  beschreibung: "Beispiel: Ein Gast schreibt um 21:47, {marke} antwortet um 21:49"
  gast_absender: "Gast · Booking.com"
  gast_text: "Hallo! Wir stehen vor dem Schlüsselsafe, der Code klappt nicht. Können Sie helfen?"
  antwort_absender: "{marke} · 21:49"
  antwort_text: "Guten Abend! Bitte den Bügel nach dem Code einmal fest nach unten drücken, dann öffnet die Klappe. Willkommen an der Mosel!"
  geprueft: "von einem Menschen geprüft"
  dank_text: "Hat geklappt, vielen Dank!"

problem:
  kicker: "Kennen Sie das?"
  titel: "Ihre Wohnung macht nie Feierabend. Ihr Handy auch nicht."
  # "titel" ist das große Stichwort oben in der Karte, die letzte Karte erscheint in Gold
  karten:
    - titel: "19:30"
      text: "Das Handy vibriert beim Abendessen. Eine Anfrage, die nicht warten will."
    - titel: "Sonntag"
      text: "Statt Ausflug mit der Familie beantworten Sie Fragen zu Parkplatz und Brötchenservice."
    - titel: "Im Urlaub"
      text: "Gäste stehen vor dem Schlüsselsafe, und Sie sitzen am Strand mit schlechtem Netz."
    - titel: "★ ★ ★"
      text: "Langsame Antworten kosten Buchungen und Sterne in der Bewertung."

rechner:
  titel: "Was kosten Sie langsame Antworten?"
  intro: "Schätzen Sie einfach grob. Nichts wird gespeichert."
  # Startwerte der Eingabefelder
  start_objekte: 3
  start_buchungen: 12
  start_buchungswert: 450
  start_anteil: 10
  label_objekte: "Ferienwohnungen"
  label_buchungen: "Buchungen pro Monat"
  label_buchungswert: "Wert pro Buchung in €"
  label_anteil: "Verlorene Buchungen in %"
  ergebnis_verlust: "Möglicher Umsatzverlust pro Jahr"
  ergebnis_kosten: "Kosten mit {marke} pro Jahr"
  hinweis: "Beispielrechnung mit Ihren Schätzwerten, kein Versprechen."
  cta: "{test_tage} Tage kostenlos testen"

gaestereise:
  kicker: "So kümmern wir uns"
  titel: "Jede Nachricht bekommt eine Antwort. Das spüren Ihre Gäste."
  text: "Gäste erinnern sich nicht nur an die Wohnung, sondern daran, wie sie sich aufgehoben gefühlt haben. Kommunikation ist bei Airbnb sogar eine eigene Bewertungskategorie. Wer immer eine freundliche Rückmeldung bekommt, reist entspannter an und schreibt eher eine gute Bewertung."
  phasen:
    - titel: "Vor der Anreise"
      punkte:
        - "Antwort auf jede Anfrage, auch abends und am Wochenende"
        - "Begrüßung direkt nach der Buchung"
        - "Anreiseinfos zum richtigen Zeitpunkt"
    - titel: "Während des Aufenthalts"
      punkte:
        - "Jede Frage wird beantwortet, von {start} bis {ende} Uhr"
        - "Kurze Nachfrage am ersten Abend, ob alles passt"
        - "Probleme lösen, bevor sie in der Bewertung stehen"
    - titel: "Nach der Abreise"
      punkte:
        - "Persönliche Dankesnachricht am Abreisetag"
        - "Bitte um eine Bewertung an jeden Gast, mit einer Erinnerung"
        - "Antwort auf jede Bewertung in Ihrem Namen"
        - "Monatlicher Bericht: was Gäste loben, was sie stört"

ablauf:
  kicker: "So einfach geht's"
  titel: "In 3 Schritten startklar. Den Rest übernehmen wir."
  # "hinweis" ist das kleine Etikett oben rechts (leer lassen = kein Etikett)
  schritte:
    - titel: "Co-Host-Einladung"
      hinweis: "Wir helfen dabei"
      text: "Sie laden uns auf Airbnb als Co-Host mit der Berechtigung „Kalender und Postfach“ ein, auf Booking.com als eigenen Benutzer. Wir zeigen Ihnen, wo Sie klicken müssen. Ihre Zugangsdaten bleiben bei Ihnen."
    - titel: "Wir lernen Ihre Unterkunft kennen"
      hinweis: "Wir machen die Arbeit"
      text: "Wir rufen Sie kurz an und fragen alles ab, was Gäste wissen wollen: Check-in, Hausregeln, WLAN, Parken, Ansprechpartner vor Ort. Daraus schreiben wir unseren Spickzettel für jede Antwort."
    - titel: "Wir übernehmen"
      hinweis: "Sie lehnen sich zurück"
      text: "Ab jetzt antworten wir Ihren Gästen. Sie bekommen abends eine kurze Zusammenfassung und hören nur dann von uns, wenn Sie wirklich entscheiden müssen."

leistungen:
  kicker: "Was wir für Sie tun"
  titel: "Damit Sie sich um nichts kümmern müssen"
  karten:
    - titel: "Antworten von {start} bis {ende} Uhr"
      text: "Jeden Tag, auch am Wochenende und an Feiertagen. Keine Nachricht bleibt liegen."
    - titel: "Check-in-Kommunikation"
      text: "Anreiseinfos zum richtigen Zeitpunkt, Rückfragen zur Schlüsselübergabe, Erinnerung vor dem Check-out."
    - titel: "Notfälle an Ihre Partner vor Ort"
      text: "Wasserschaden, Stromausfall, ausgesperrte Gäste: Wir informieren sofort Ihre hinterlegte Hausmeisterin, Reinigung oder Sie selbst. Nach festem Ablauf."
    - titel: "Nachkontakt nach der Abreise"
      text: "Am Abreisetag bedanken wir uns persönlich und fragen nach einer Bewertung. Fehlt sie nach einigen Tagen, erinnern wir einmal freundlich."
    - titel: "Bewertungsmanagement"
      text: "Wir beantworten jede Bewertung in Ihrem Namen, gute wie kritische. Kritik melden wir Ihnen sofort, damit Sie reagieren können."
    - titel: "Technik hilft, Menschen entscheiden"
      text: "Eine KI schreibt Entwürfe, damit es schnell geht. Alles Wichtige wie Geld, Stornierungen, Beschwerden oder Notfälle lesen und beantworten wir selbst."
    - titel: "Tägliche Zusammenfassung und Monatsbericht"
      text: "Jeden Abend eine E-Mail: was gefragt wurde, was wir geantwortet haben, was offen ist. Einmal im Monat: was Gäste in Bewertungen loben und was sie stört."

vergleich:
  kicker: "Ganz wie Sie möchten"
  titel: "Sie entscheiden, was Sie abgeben."
  intro: "Manche Gastgeber möchten alles abgeben, andere nur die Abende und Wochenenden. Stellen Sie sich Ihr Paket zusammen, gern auch für jede Wohnung anders. Wir melden uns mit einem passenden Angebot."
  beschriftung: "Aufgaben, die Sie an {marke} abgeben können"
  label_sie: "Bei Ihnen"
  label_wir: "Übernimmt {marke}"
  # {anzahl} und {gesamt} werden automatisch ersetzt
  zusammenfassung: "{anzahl} von {gesamt} Aufgaben geben Sie ab."
  leer: "Noch nichts ausgewählt. Schalten Sie die Aufgaben ein, die wir übernehmen sollen."
  cta: "Wunschpaket anfragen"
  cta_hinweis: "Ihre Auswahl wird mit der Anfrage gesendet. Sie können sie danach jederzeit ändern."
  # wer: "wir" = am Anfang eingeschaltet, "sie" = am Anfang ausgeschaltet
  zeilen:
    - { aufgabe: "Gästefragen beantworten", wer: "wir" }
    - { aufgabe: "Check-in-Infos und Erinnerungen versenden", wer: "wir" }
    - { aufgabe: "Notfälle an Partner vor Ort weitergeben", wer: "wir" }
    - { aufgabe: "Nachkontakt und Bitte um Bewertung", wer: "wir" }
    - { aufgabe: "Bewertungen beantworten", wer: "wir" }
    - { aufgabe: "Buchungsanfragen nach Ihren Regeln annehmen oder ablehnen", wer: "sie" }
    - { aufgabe: "Reinigung und Übergaben mit Ihren Partnern abstimmen", wer: "sie" }
    - { aufgabe: "Preise, Kalender und Hausregeln pflegen", wer: "sie" }

# Nur echte, belegbare Zahlen und Kundenstimmen mit dokumentierter Einwilligung.
# Solange beide Listen leer sind ( [] ), wird der Abschnitt nicht angezeigt.
# Beispiel für einen Eintrag (Rauten am Zeilenanfang entfernen):
#  kennzahlen:
#    - wert: "8 Minuten"
#      beschreibung: "durchschnittliche Antwortzeit"
#      quelle: "Auswertung Januar bis März 2027, 6 Objekte"
#  stimmen:
#    - zitat: "..."
#      name: "Vorname N."
#      ort: "Bernkastel-Kues"
#      objekte: "3 Ferienwohnungen"
ergebnisse:
  titel: "Ergebnisse unserer Kunden"
  kennzahlen: []
  stimmen: []

# Persönlicher Abschnitt: wer hinter dem Angebot steht.
# Das wichtigste Element, damit die Seite menschlich wirkt. Bitte mit echten Angaben füllen.
# Foto: Datei nach public/ legen (z. B. public/team.jpg) und unten eintragen: foto: "/team.jpg"
persoenlich:
  sichtbar: true
  # Linke Seite: wie Mensch und KI zusammenarbeiten
  kicker: "Kein Callcenter. Kein Roboter."
  titel: "Eine KI schreibt vor. Ein Mensch entscheidet."
  einleitung: "Die KI hilft uns, schnell zu sein. Bei allem, was zählt, liest ein Mensch mit, bevor eine Nachricht rausgeht. Wir kümmern uns um Ihre Gäste, als wären es unsere eigenen."
  themen:
    - "Geld"
    - "Stornierungen"
    - "Beschwerden"
    - "Notfälle"
  themen_hinweis: "Diese Themen prüft immer ein Mensch."
  # Rechte Seite: wer hinter anytime steht
  text:
    - "Hallo, ich bin [VORNAME]. [2 bis 3 Sätze in Ihren eigenen Worten: Warum Sie anytime gegründet haben, z. B. eigene Erfahrung als Gastgeber oder Gastgeberin an der Mosel.]"
    - "[1 bis 2 Sätze: Wer im Team antwortet, und was Ihnen beim Umgang mit Gästen wichtig ist.]"
  unterschrift: "[VORNAME]"
  rolle: "[ROLLE, z. B. Gründer von anytime]"
  foto: ""
  foto_alt: "[BESCHREIBUNG DES FOTOS, z. B. Porträt von VORNAME NACHNAME]"
  foto_platzhalter: "Foto: [Person hinter anytime, z. B. an der Mosel]"

preise_abschnitt:
  kicker: "Fair und einfach"
  titel: "Ein Preis. Nur wenn Sie Buchungen haben."
  einheit: "pro Buchung"
  test_hinweis: "Die ersten {test_tage} Tage sind kostenlos."
  # Kleiner Kostenrechner mit Schieberegler
  rechner_frage: "Wie viele Buchungen haben Sie im Monat?"
  rechner_start: 8
  rechner_max: 40
  rechner_einheit: "Buchungen"
  rechner_zeitraum: "im Monat"
  punkte:
    - "Keine Grundgebühr"
    - "Monatlich kündbar"
    - "Alle Leistungen inklusive"
    - "Abrechnung über die Airbnb-Co-Host-Auszahlung"
  abrechnung_booking: "[ZU KLÄREN: Abrechnung für Booking.com-Buchungen, Vorschlag: monatliche Rechnung]"
  steuer: "Gemäß § 19 UStG wird keine Umsatzsteuer berechnet. Der Preis ist ein Endpreis."
  buchung_definition: "Als Buchung zählt: [ZU KLÄREN, Vorschlag: jede bestätigte, nicht stornierte Buchung mit Anreise im Abrechnungsmonat]."
  gruenderpreis_titel: "Gründerpreis"
  gruenderpreis_text: "{gp_preis} € pro Buchung für {gp_monate} Monate für die ersten {gp_plaetze} Kunden."
  # {frei} wird durch die Zahl freier Plätze ersetzt
  zaehler_text: "{frei} von {gp_plaetze} Plätzen frei"
  zaehler_hinweis: "Stand von Hand gepflegt."
  test_titel: "Bedingungen der Testphase"
  test_bedingungen:
    - { titel: "Beginn", text: "an dem Tag, an dem wir die erste Gästenachricht für Sie beantworten." }
    - { titel: "Dauer", text: "{test_tage} Kalendertage. Danach endet der Test automatisch." }
    - { titel: "Kosten", text: "0 €. Für Buchungen in diesem Zeitraum berechnen wir nichts." }
    - { titel: "Danach", text: "Es passiert nichts automatisch. Wir fragen Sie, ob Sie weitermachen möchten. Ein Vertrag entsteht nur, wenn Sie und wir ihn ausdrücklich bestätigen, zum Beispiel per E-Mail. Ohne Bestätigung entfernen Sie uns einfach als Co-Host." }
  gp_titel: "Bedingungen des Gründerpreises"
  gp_bedingungen:
    - "Gilt für die ersten {gp_plaetze} Kunden, die nach der Testphase einen Vertrag mit uns schließen."
    - "{gp_preis} € pro Buchung für {gp_monate} Monate ab Vertragsbeginn."
    - "Danach gilt der reguläre Preis von {preis} € pro Buchung. Wir erinnern Sie {erinnerung} vorher. Sie können weiterhin monatlich kündigen."

# Drei Angebotskarten im grünen Preisbereich.
# anliegen: "test", "check" oder "agentur" (wählt das passende Anliegen im Formular vor)
# stil: "hell" oder "dunkel"; empfohlen: true = grünes Etikett und grüner Knopf
angebote:

# ---------------------------------------------------------------------
# WOHNUNGS-STECKBRIEF (Seite /steckbrief und Seiten 3 bis 4 der Infomappe)
# Die Fragen stehen nur hier. Online-Formular und PDF werden daraus erzeugt.
# Feldarten (typ): text, email, tel, textarea, auswahl (eine Antwort), mehrfach (mehrere Antworten)
# "name" ist der technische Feldname: nur Kleinbuchstaben, keine Leerzeichen, nach dem Start nicht mehr ändern.
# Nach Änderungen das PDF neu erzeugen: im Terminal "npm run infomappe".
# ---------------------------------------------------------------------
steckbrief:
  seo_titel: "Wohnungs-Steckbrief | {marke}"
  kicker: "Etwa 10 Minuten"
  titel: "Ihr Wohnungs-Steckbrief"
  einleitung: "Mit diesen Angaben betreuen wir Ihre Gäste vom ersten Tag an so, als wären Sie selbst da. Nur Name und E-Mail sind Pflicht. Was Sie gerade nicht wissen, klären wir gern am Telefon."
  sicherheit: "Bitte tragen Sie keine Safe-Codes, Türcodes oder Passwörter ein. Die besprechen wir sicher am Telefon."
  pdf_hinweis: "Lieber auf Papier?"
  pdf_link: "Steckbrief als PDF herunterladen"
  absenden: "Steckbrief senden"
  abschnitte:
    - titel: "Ihre Kontaktdaten"
      felder:
        - { name: "name", label: "Vor- und Nachname", typ: "text", pflicht: true }
        - { name: "email", label: "E-Mail-Adresse", typ: "email", pflicht: true }
        - { name: "telefon", label: "Telefon", typ: "tel" }
        - { name: "erreichbar", label: "Wann erreichen wir Sie am besten?", typ: "text", platzhalter: "z. B. werktags ab 17 Uhr" }
    - titel: "Ihre Unterkunft"
      felder:
        - { name: "unterkunft", label: "Name der Unterkunft", typ: "text", platzhalter: "z. B. Ferienwohnung Moselblick" }
        - { name: "ort", label: "Ort", typ: "text" }
        - { name: "anzahl", label: "Wie viele Ferienwohnungen betreuen Sie?", typ: "auswahl", optionen: ["1", "2 bis 3", "4 bis 6", "7 bis 10", "mehr als 10"] }
        - { name: "gaeste", label: "Für wie viele Gäste ist die Unterkunft ausgelegt?", typ: "text" }
        - { name: "plattformen", label: "Wo vermieten Sie?", typ: "mehrfach", optionen: ["Airbnb", "Booking.com", "Eigene Website", "Andere"] }
        - { name: "inserate", label: "Links zu Ihren Inseraten", typ: "textarea" }
    - titel: "Anreise und Abreise"
      felder:
        - { name: "checkin", label: "Check-in ab", typ: "text", platzhalter: "z. B. 15 Uhr" }
        - { name: "checkout", label: "Check-out bis", typ: "text", platzhalter: "z. B. 10 Uhr" }
        - { name: "schluessel", label: "Wie bekommen Gäste den Schlüssel?", typ: "auswahl", optionen: ["Schlüsselsafe", "Persönliche Übergabe", "Elektronisches Schloss", "Nachbar oder Hausmeister", "Anders"] }
        - { name: "anreise", label: "Wie finden Gäste den Eingang, und wo parken sie?", typ: "textarea" }
        - { name: "flexibel", label: "Sind frühe Anreise oder später Check-out möglich?", typ: "auswahl", optionen: ["Ja, gegen Absprache", "Nein", "Bitte jedes Mal bei mir nachfragen"] }
    - titel: "Während des Aufenthalts"
      felder:
        - { name: "ausstattung", label: "Wonach fragen Gäste oft?", typ: "textarea", platzhalter: "z. B. Heizung, Kamin, Waschmaschine, Kinderbett, Fahrräder" }
        - { name: "hausregeln", label: "Ihre Hausregeln", typ: "textarea", platzhalter: "z. B. Haustiere, Rauchen, Ruhezeiten, Müll" }
        - { name: "tipps", label: "Ihre Tipps für die Umgebung", typ: "textarea", platzhalter: "z. B. Bäcker, Restaurants, Weingüter, Ausflüge" }
    - titel: "Ihre Partner vor Ort"
      felder:
        - { name: "reinigung", label: "Reinigung: Name und Telefon", typ: "text" }
        - { name: "hausmeister", label: "Hausmeister oder Handwerker: Name und Telefon", typ: "text" }
        - { name: "notfall", label: "Wer hilft bei Notfällen wie Wasserschaden oder Stromausfall?", typ: "textarea" }
        - { name: "rueckfragen", label: "Wann dürfen wir Sie bei dringenden Fragen anrufen?", typ: "auswahl", optionen: ["Jederzeit", "Nur tagsüber", "Nur in Notfällen"] }
    - titel: "Ihr Stil und Ihre Wünsche"
      felder:
        - { name: "anrede", label: "Wie sollen wir Ihre Gäste ansprechen?", typ: "auswahl", optionen: ["Mit Sie", "Mit Du", "So, wie der Gast schreibt"] }
        - { name: "ton", label: "Welcher Ton passt zu Ihnen?", typ: "auswahl", optionen: ["Herzlich und locker", "Freundlich und sachlich", "Eher förmlich"] }
        - { name: "aufgaben", label: "Was sollen wir übernehmen?", typ: "mehrfach", optionen: ["Gästefragen beantworten", "Check-in-Infos versenden", "Notfälle an Partner weitergeben", "Dank und Bitte um Bewertung", "Bewertungen beantworten"] }
        - { name: "wichtig", label: "Was ist Ihnen im Umgang mit Gästen besonders wichtig?", typ: "textarea" }
    - titel: "Zum Schluss"
      felder:
        - { name: "start", label: "Ab wann möchten Sie starten?", typ: "text" }
        - { name: "anmerkungen", label: "Möchten Sie uns noch etwas sagen?", typ: "textarea" }


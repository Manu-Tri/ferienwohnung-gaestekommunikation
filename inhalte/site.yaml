faq:
  kicker: "Gut zu wissen"
  titel: "Fragen, die uns oft gestellt werden"
  fragen:
    - frage: "Ist das mit den Regeln von Airbnb vereinbar?"
      antwort: "Ja. Airbnb sieht Co-Hosts ausdrücklich vor, mit verschiedenen Berechtigungsstufen und der Möglichkeit, Co-Hosts an der Auszahlung zu beteiligen. Wir kommunizieren ausschließlich über das Postfach der Plattform. Wir sind ein unabhängiger Dienstleister und nicht mit Airbnb oder Booking.com verbunden. [ZU PRÜFEN: welche Berechtigungsstufe für die Auszahlungsbeteiligung nötig ist]"
    - frage: "Welche Plattformen unterstützen Sie?"
      antwort: "Airbnb und Booking.com. [WEITERE PLATTFORMEN ODER CHANNEL MANAGER]"
    - frage: "Wie gehen Sie mit den Daten meiner Gäste um?"
      antwort: "Wir verarbeiten Gästedaten nur in Ihrem Auftrag und schließen dafür einen Vertrag zur Auftragsverarbeitung nach Art. 28 DSGVO. Wir sehen nur, was die Plattform einem Co-Host zeigt. [SPEICHERORT UND HOSTING DER WISSENSBASIS UND DER KI]"
    - frage: "Wofür setzen Sie KI ein?"
      antwort: "Für Entwürfe von Antworten auf Basis Ihrer Wissensbasis. Routinefragen wie WLAN oder Anreise können nach Ihrer Freigabe direkt beantwortet werden. Alles zu Geld, Stornierung, Beschwerden, Schäden und Notfällen prüft vor dem Versand ein Mensch."
    - frage: "Wie läuft der Nachkontakt mit den Gästen?"
      antwort: "Am Abreisetag schicken wir eine persönliche Dankesnachricht und bitten um eine Bewertung. Wir fragen jeden Gast, ohne Gegenleistung und nach den Regeln der Plattform. Fehlt die Bewertung nach einigen Tagen, erinnern wir einmal. Jede eingehende Bewertung beantworten wir in Ihrem Namen."
    - frage: "Was passiert bei einem Notfall in der Nacht?"
      antwort: "Zwischen {ende} und {start} Uhr ist das Postfach nicht besetzt. [ZU KLÄREN: Notfallregel nachts, z. B. automatischer Hinweis mit der Notfallnummer Ihres Partners vor Ort.] Ab {start} Uhr bearbeiten wir offene Nachrichten zuerst."
    - frage: "Was passiert, wenn Ihnen ein Fehler unterläuft?"
      antwort: "Wir sagen es Ihnen am selben Tag, korrigieren die Antwort gegenüber dem Gast und ergänzen die Wissensbasis, damit es nicht wieder passiert. [HAFTUNG UND BETRIEBSHAFTPFLICHT]"
    - frage: "Wie kündige ich?"
      antwort: "Monatlich, per E-Mail, ohne Begründung. Zusätzlich entfernen Sie uns als Co-Host. Damit endet unser Zugriff sofort."
    - frage: "Wie läuft die Abrechnung, und weisen Sie Umsatzsteuer aus?"
      antwort: "Auf Airbnb automatisch über die Co-Host-Auszahlung, Sie erhalten zusätzlich eine monatliche Übersicht. Gemäß § 19 UStG wird keine Umsatzsteuer berechnet, die Rechnung weist deshalb keine Umsatzsteuer aus."
    - frage: "Wird der Test automatisch zum Vertrag?"
      antwort: "Nein. Nach {test_tage} Tagen fragen wir Sie. Ohne Ihre und unsere Bestätigung entsteht kein Vertrag."
    - frage: "Muss ich meine Zugangsdaten herausgeben?"
      antwort: "Nein. Sie laden uns als Co-Host oder als eigenen Benutzer ein und können den Zugriff jederzeit selbst entziehen."

abschluss:
  kicker: "Heute Abend schon?"
  # Der Satz nach dem ersten Punkt leuchtet in Mint
  titel: "Ihre Gäste sind gut betreut. Machen Sie Feierabend."
  text: "Jeder Gast bekommt eine Antwort, Sie bekommen mehr Freiheit. Testen Sie {test_tage} Tage ohne Kosten und ohne Vertrag. Oder lassen Sie zuerst Ihr Inserat prüfen: {verbesserungen} konkrete Verbesserungen innerhalb von {check_stunden} Stunden."

footer:

# =====================================================================
# ZENTRALE INHALTSDATEI
# Hier stehen alle Texte, Preise, Zeiten und Links der Website.
#
# So ändern Sie Inhalte:
# 1. Text zwischen den Anführungszeichen ändern. Einrückung (Leerzeichen
#    am Zeilenanfang) bitte genau so lassen.
# 2. Speichern. Beim nächsten Build (oder automatisch auf Netlify)
#    ist die Änderung online. Ist die Datei fehlerhaft, bricht der Build
#    mit einer verständlichen Meldung ab und die alte Seite bleibt online.
#
# Variablen in geschweiften Klammern werden automatisch ersetzt:
#   {marke} {preis} {start} {ende} {antwortzeit} {test_tage}
#   {gp_preis} {gp_monate} {gp_plaetze} {check_stunden}
#   {verbesserungen} {region} {email} {telefon} {antwort_frist} {steckbrief_link}
# Wenn Sie also unten den Preis ändern, ändert er sich überall.
#
# Eckige Klammern wie [MARKENNAME] sind offene Platzhalter.
# Liste aller offenen Platzhalter: im Terminal "npm run platzhalter".
#
# Bitte keine Gedankenstriche verwenden. Prüfung: "npm run pruefen:striche".
# =====================================================================

marke:
  name: "anytime"
  # Vollständige Adresse der Website, ohne Schrägstrich am Ende
  domain: "https://www.example.de"
  email: "[E-MAIL-ADRESSE]"
  telefon: "[TELEFONNUMMER]"
  ort: "[ORT]"
  # Region, die auf der Startseite genannt wird
  region: "[REGION, z. B. Mosel, Eifel, Nordsee]"
  # Regionen für Suchmaschinen (strukturierte Daten "areaServed")
  einsatzgebiet:
    - "Deutschland"

service:
  start_uhr: 7
  ende_uhr: 23
  antwortzeit_minuten: 15
  # Wie schnell melden Sie sich nach einer Testanfrage?
  antwort_frist: "[24 Stunden]"

preise:
  pro_buchung: 9
  test_tage: 30
  gruenderpreis:
    pro_buchung: 6
    monate: 12
    plaetze_gesamt: 10
    # Freie Plätze. Nur von Hand pflegen. Leer lassen = kein Zähler sichtbar.
    # Beispiel:  plaetze_frei: 7
    plaetze_frei:
    erinnerung_vorher: "[4 Wochen]"

lead_magnet:
  check_stunden: 48
  verbesserungen: 5

links:
  # Link zur Terminbuchung (z. B. Cal.com, Calendly). Wird nur als Link geöffnet.
  buchungslink: "[BUCHUNGSLINK]"
  buchungsanbieter: "[ANBIETER DER TERMINBUCHUNG]"

formular:
  # "netlify" = Netlify Forms (Standard). "extern" = anderer Formulardienst,
  # dann unten die Adresse eintragen, an die das Formular gesendet wird.
  anbieter: "netlify"
  endpunkt: ""
  name: "anfrage"

analytics:
  # true = cookieloses Plausible einbinden. Absatz in der Datenschutz-
  # erklärung erscheint dann automatisch.
  plausible: false
  plausible_domain: "www.example.de"

seo:
  titel: "Gästebetreuung für Ferienwohnungen, {start} bis {ende} Uhr | {marke}"
  beschreibung: "Wir beantworten alle Gästenachrichten auf Airbnb und Booking.com von {start} bis {ende} Uhr. {preis} € pro Buchung, ohne Grundgebühr, {test_tage} Tage kostenlos testen."

# ---------------------------------------------------------------------
# TEXTE DER STARTSEITE (von oben nach unten)
# ---------------------------------------------------------------------

navigation:
  - { text: "So funktioniert's", ziel: "#ablauf" }
  - { text: "Preise", ziel: "#preise" }
  - { text: "Inserats-Check", ziel: "#angebote" }
  - { text: "Für Agenturen", ziel: "#agenturen" }
  - { text: "FAQ", ziel: "#faq" }

cta:
  test: "{test_tage} Tage kostenlos testen"
  test_kurz: "Kostenlos testen"
  check: "Kostenlosen Inserats-Check anfordern"
  check_kurz: "Inserats-Check"

hero:
  # Kleine Zeile über der Überschrift: sagt in 3 Sekunden, was Sie anbieten
  kicker: "Für Vermieter von Ferienwohnungen"
  # Der Satz nach dem ersten Punkt wird grün hervorgehoben.
  # Weitere Varianten aus dem Entwurf:
  #   "Ihre Gäste bekommen Antwort. Sie bekommen Feierabend."
  #   "Ihre Ferienwohnung ist gut betreut. Ihre Freizeit gehört wieder Ihnen."
  titel: "Wir antworten Ihren Gästen. Sie haben frei."
  unterzeile: "Wir beantworten die Nachrichten Ihrer Gäste auf Airbnb und Booking.com, von der ersten Anfrage bis zur Bewertung. Täglich von {start} bis {ende} Uhr, meist innerhalb von {antwortzeit} Minuten, und so, wie Sie selbst schreiben würden."
  vertrauen:
    - "Keine Grundgebühr"
    - "Monatlich kündbar"
    - "DSGVO-konform"
    - "Ein Mensch prüft alles Wichtige"

# Laufendes Band unter dem ersten Bildschirm. Punkte laufen endlos von rechts nach links.
laufband:
  punkte:
    - "Täglich {start} bis {ende} Uhr"
    - "Auch sonntags und an Feiertagen"
    - "Persönlich betreut"
    - "Herzliche Antworten in Ihrem Ton"
    - "Keine Grundgebühr"
    - "Monatlich kündbar"
    - "{test_tage} Tage kostenlos testen"

# Kleines Gespräch im ersten Bildschirm. Die Nachrichten erscheinen nacheinander,
# vor jeder Antwort von uns kurz "schreibt …". Ohne JavaScript ist alles sofort sichtbar.
# von: "gast" oder "wir". "absender" ist die kleine Zeile über der Nachricht (leer lassen = keine).
# Bitte nicht mehr als 6 Nachrichten, sonst wird der erste Bildschirm zu hoch.
chat_demo:
  # Große Uhrzeit über dem Chat (leer lassen = keine Uhrzeit, z. B.  uhrzeit: "21:47")
  uhrzeit: ""
  # Handschriftliche Notiz über dem Chat
  notiz: "Sie sitzen gerade beim Abendessen."
  # Für Screenreader: beschreibt das Gespräch in einem Satz
  beschreibung: "Beispiel: Ein Gast fragt abends nach früherem Check-in und einem Parkplatz, {marke} antwortet nach wenigen Minuten"
  # Zeile unter unserer letzten Antwort (Doppelhäkchen wird davor gesetzt)
  geprueft: "gelesen und beantwortet"
  nachrichten:
    - von: "gast"
      absender: "Gast · Airbnb · 21:42"
      text: "Guten Abend! Wir kommen morgen schon gegen 13 Uhr an. Können wir früher rein?"
    - von: "wir"
      absender: "{marke} · 21:44"
      text: "Guten Abend, schön, dass Sie kommen! Die Wohnung ist ab 14 Uhr fertig. Ihr Gepäck können Sie aber gern schon um 13 Uhr abstellen."
    - von: "gast"
      text: "Super! Und wo können wir parken?"
    - von: "wir"
      absender: "{marke} · 21:45"
      text: "Direkt am Haus ist Stellplatz Nummer 3 für Sie reserviert. Gute Fahrt und bis morgen!"
    - von: "gast"
      text: "Perfekt, vielen Dank! 😊"

problem:
  titel: "Gäste schreiben selten dann, wenn es Ihnen gerade passt."
  # "titel" ist das große Stichwort oben in der Karte, die letzte Karte erscheint in Gold
  karten:
    - titel: "19:30"
      text: "Beim Abendessen kommt eine Anfrage. Wer erst am nächsten Morgen antwortet, verliert den Gast manchmal an die Wohnung nebenan."
    - titel: "Sonntag"
      text: "Eigentlich wollten Sie mit der Familie raus. Stattdessen erklären Sie, wo man parkt und ob es morgens Brötchen gibt."
    - titel: "Im Urlaub"
      text: "Die Gäste stehen vor dem Schlüsselsafe, und Sie liegen am Strand und haben kaum Empfang."
    - titel: "★ ★ ★"
      text: "Wer lange auf eine Antwort wartet, schreibt das gern in die Bewertung. Und dann fehlt ein Stern."

rechner:
  titel: "Was kosten Sie langsame Antworten?"
  intro: "Grobe Schätzungen reichen. Wir speichern nichts davon."
  # Startwerte der Eingabefelder
  start_objekte: 3
  start_buchungen: 12
  start_buchungswert: 450
  start_anteil: 10
  label_objekte: "Ferienwohnungen"
  label_buchungen: "Buchungen pro Monat"
  label_buchungswert: "Wert pro Buchung in €"
  label_anteil: "Verlorene Buchungen in %"
  ergebnis_verlust: "Möglicher Umsatzverlust pro Jahr"
  ergebnis_kosten: "Kosten mit {marke} pro Jahr"
  hinweis: "Beispielrechnung mit Ihren Schätzwerten, kein Versprechen."
  cta: "{test_tage} Tage kostenlos testen"

gaestereise:
  titel: "Vom ersten Hallo bis zur Bewertung"
  text: "Gäste merken sich die Wohnung, aber auch, ob sich jemand um sie gekümmert hat. Bei Airbnb ist Kommunikation sogar eine eigene Bewertungskategorie. Wer schnell eine freundliche Antwort bekommt, reist entspannter an und bewertet eher gut."
  phasen:
    - titel: "Vor der Anreise"
      punkte:
        - "Antwort auf jede Anfrage, auch abends und am Wochenende"
        - "Begrüßung direkt nach der Buchung"
        - "Anreiseinfos zum richtigen Zeitpunkt"
    - titel: "Während des Aufenthalts"
      punkte:
        - "Jede Frage wird beantwortet, von {start} bis {ende} Uhr"
        - "Kurze Nachfrage am ersten Abend, ob alles passt"
        - "Bei Notfällen rufen wir sofort Ihre Partner vor Ort an"
        - "Probleme lösen, bevor sie in der Bewertung stehen"
    - titel: "Nach der Abreise"
      punkte:
        - "Persönliche Dankesnachricht am Abreisetag"
        - "Bitte um eine Bewertung an jeden Gast, mit einer Erinnerung"
        - "Antwort auf jede Bewertung in Ihrem Namen"
        - "Monatlicher Bericht: was Gäste loben, was sie stört"

ablauf:
  titel: "So fangen wir gemeinsam an"
  # "hinweis" ist das kleine Etikett oben rechts (leer lassen = kein Etikett)
  schritte:
    - titel: "Sie laden uns ein"
      hinweis: "Wir helfen dabei"
      text: "Sie geben uns auf Airbnb und Booking.com Zugriff auf Ihr Postfach, ähnlich wie einer Vertretung. Wir zeigen Ihnen am Telefon jeden Klick. Ihr Passwort bleibt bei Ihnen, und Sie können uns jederzeit selbst wieder entfernen."
    - titel: "Wir lernen Ihre Unterkunft kennen"
      hinweis: "Ein kurzes Telefonat"
      text: "Wir rufen Sie kurz an und fragen alles ab, was Gäste wissen wollen: Check-in, Hausregeln, WLAN, Parken, Ansprechpartner vor Ort. Daraus schreiben wir unseren Spickzettel für jede Antwort."
    - titel: "Wir übernehmen"
      hinweis: "Ab hier haben Sie frei"
      text: "Ab jetzt antworten wir Ihren Gästen. Sie bekommen abends eine kurze Zusammenfassung und hören nur dann von uns, wenn Sie wirklich entscheiden müssen."

leistungen:
  titel: "Was wir im Alltag für Sie erledigen"
  karten:
    - titel: "Antworten von {start} bis {ende} Uhr"
      text: "Jeden Tag, auch am Wochenende und an Feiertagen. Wir beantworten jede Nachricht, auch die kleinen."
    - titel: "Check-in-Kommunikation"
      text: "Anreiseinfos zum richtigen Zeitpunkt, Rückfragen zur Schlüsselübergabe, Erinnerung vor dem Check-out."
    - titel: "Notfälle an Ihre Partner vor Ort"
      text: "Bei Wasserschaden, Stromausfall oder ausgesperrten Gästen rufen wir sofort Ihre Hausmeisterin, die Reinigung oder Sie selbst an. Wer wann dran ist, legen wir vorher gemeinsam fest."
    - titel: "Nachkontakt nach der Abreise"
      text: "Am Abreisetag bedanken wir uns persönlich und fragen nach einer Bewertung. Fehlt sie nach einigen Tagen, erinnern wir einmal freundlich."
    - titel: "Antworten auf Bewertungen"
      text: "Wir beantworten jede Bewertung in Ihrem Namen, gute wie kritische. Kritik melden wir Ihnen sofort, damit Sie reagieren können."
    - titel: "Feste Ansprechperson für Sie"
      text: "Sie erreichen uns per Telefon und E-Mail. Wir kennen Ihre Wohnungen, und alles Wichtige wie Geld, Stornierungen, Beschwerden oder Notfälle bearbeiten wir persönlich."
    - titel: "Tägliche Zusammenfassung und Monatsbericht"
      text: "Abends schicken wir Ihnen eine kurze E-Mail mit allem, was gefragt wurde und was noch offen ist. Einmal im Monat fassen wir zusammen, was Gäste loben und was sie stört."

vergleich:
  titel: "Sie entscheiden, was Sie abgeben."
  intro: "Manche Gastgeber möchten alles abgeben, andere nur die Abende und Wochenenden. Stellen Sie sich Ihr Paket zusammen, gern auch für jede Wohnung anders. Wir melden uns mit einem passenden Angebot."
  beschriftung: "Aufgaben, die Sie an {marke} abgeben können"
  label_sie: "Bei Ihnen"
  label_wir: "Übernimmt {marke}"
  # {anzahl} und {gesamt} werden automatisch ersetzt
  zusammenfassung: "{anzahl} von {gesamt} Aufgaben geben Sie ab."
  leer: "Noch nichts ausgewählt. Schalten Sie die Aufgaben ein, die wir übernehmen sollen."
  cta: "Wunschpaket anfragen"
  cta_hinweis: "Ihre Auswahl wird mit der Anfrage gesendet. Sie können sie danach jederzeit ändern."
  # wer: "wir" = am Anfang eingeschaltet, "sie" = am Anfang ausgeschaltet
  zeilen:
    - { aufgabe: "Gästefragen beantworten", wer: "wir" }
    - { aufgabe: "Check-in-Infos und Erinnerungen versenden", wer: "wir" }
    - { aufgabe: "Notfälle an Partner vor Ort weitergeben", wer: "wir" }
    - { aufgabe: "Nachkontakt und Bitte um Bewertung", wer: "wir" }
    - { aufgabe: "Bewertungen beantworten", wer: "wir" }
    - { aufgabe: "Buchungsanfragen nach Ihren Regeln annehmen oder ablehnen", wer: "sie" }
    - { aufgabe: "Reinigung und Übergaben mit Ihren Partnern abstimmen", wer: "sie" }
    - { aufgabe: "Preise, Kalender und Hausregeln pflegen", wer: "sie" }

# Nur echte, belegbare Zahlen und Kundenstimmen mit dokumentierter Einwilligung.
# Solange beide Listen leer sind ( [] ), wird der Abschnitt nicht angezeigt.
# Beispiel für einen Eintrag (Rauten am Zeilenanfang entfernen):

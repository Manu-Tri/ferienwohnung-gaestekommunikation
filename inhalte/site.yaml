chat_demo:
  kopf: "Nachrichten · Ferienwohnung Moselblick"
  gast_name: "Familie Weber"
  gast_kuerzel: "FW"
  hinweis: "Beispieldarstellung"
  # Die ersten zwei Nachrichten sind sofort sichtbar, die weiteren laufen beim Scrollen ein.
  # von: "gast" = Nachricht des Gastes, "wir" = unsere Antwort, "trenner" = Zwischenzeile (z. B. neuer Tag)
  nachrichten:
    - von: "gast"
      zeit: "So, 21:47"
      text: "Hallo, wir stehen vor der Tür und der Schlüsselsafe geht nicht auf. Was können wir tun?"
    - von: "wir"
      zeit: "So, 21:47"
      text: "Guten Abend Frau Weber, das tut mir leid. Drücken Sie bitte nach dem Code einmal fest auf die Taste unten rechts, dann öffnet die Klappe. Falls es nicht klappt, ruft Sie in 10 Minuten unser Partner vor Ort an."
    - von: "gast"
      zeit: "So, 21:49"
      text: "Hat geklappt, danke! Gibt es in der Nähe noch etwas zu essen?"
    - von: "wir"
      zeit: "So, 21:49"
      text: "Wie schön, willkommen! Die Gaststätte an der Ecke hat bis 22:30 Uhr warme Küche, 3 Minuten zu Fuß. Einen schönen Abend!"
    - von: "trenner"
      text: "Donnerstag, Abreisetag"
    - von: "wir"
      zeit: "Do, 10:05"
      text: "Vielen Dank für Ihren Besuch, Familie Weber. Gute Heimreise! Wir würden uns sehr über eine kurze Bewertung freuen."

problem:
  titel: "Gästekommunikation hält sich nicht an Ihre Arbeitszeiten."
  karten:
    - titel: "Sonntag, 21:47 Uhr."
      text: "Die Frage nach dem WLAN-Passwort kommt nicht dann, wenn Sie Zeit haben. Sie kommt beim Abendessen, im Meeting oder im Urlaub."
    - titel: "Langsame Antworten kosten Buchungen."
      text: "Plattformen zeigen Ihre Antwortrate und Antwortzeit an. Wer auf eine Anfrage erst am nächsten Morgen reagiert, verliert den Gast oft an das nächste Inserat."
    - titel: "Check-in ohne Plan."
      text: "Anreisezeit, Schlüsselübergabe, Parkplatz: Dieselben fünf Fragen kommen bei jeder Buchung. Fehlt eine Antwort, steht der Gast vor verschlossener Tür."
    - titel: "Bewertungen hängen an der Kommunikation."
      text: "Eine gute Unterkunft mit holpriger Kommunikation bekommt trotzdem 4 statt 5 Sterne."

rechner:
  titel: "Was kosten Sie langsame Antworten?"
  intro: "Ihre Zahlen, grob geschätzt. Nichts wird gespeichert."
  # Startwerte der Eingabefelder
  start_objekte: 3
  start_buchungen: 12
  start_buchungswert: 450
  start_anteil: 10
  label_objekte: "Ferienwohnungen"
  label_buchungen: "Buchungen pro Monat"
  label_buchungswert: "Wert pro Buchung in €"
  label_anteil: "Verlorene Buchungen in %"
  ergebnis_verlust: "Möglicher Umsatzverlust pro Jahr"
  ergebnis_kosten: "Kosten mit {marke} pro Jahr"
  hinweis: "Beispielrechnung mit Ihren Schätzwerten, kein Versprechen."
  cta: "{test_tage} Tage kostenlos testen"

gaestereise:
  titel: "Jede Nachricht bekommt eine Antwort. Das spüren Ihre Gäste."
  text: "Gäste bewerten nicht nur die Wohnung, sondern auch, wie gut sie sich betreut gefühlt haben. Kommunikation ist bei Airbnb eine eigene Bewertungskategorie. Wer immer eine Rückmeldung bekommt, fragt weniger nach, reist entspannter an und schreibt eher eine gute Bewertung."
  phasen:
    - titel: "Vor der Anreise"
      punkte:
        - "Antwort auf jede Anfrage, auch abends und am Wochenende"
        - "Begrüßung direkt nach der Buchung"
        - "Anreiseinfos zum richtigen Zeitpunkt"
    - titel: "Während des Aufenthalts"
      punkte:
        - "Jede Frage wird beantwortet, von {start} bis {ende} Uhr"
        - "Kurze Nachfrage am ersten Abend, ob alles passt"
        - "Probleme lösen, bevor sie in der Bewertung stehen"
    - titel: "Nach der Abreise"
      punkte:
        - "Persönliche Dankesnachricht am Abreisetag"
        - "Bitte um eine Bewertung an jeden Gast, mit einer Erinnerung"
        - "Antwort auf jede Bewertung in Ihrem Namen"
        - "Monatlicher Bericht: was Gäste loben, was sie stört"

ablauf:
  titel: "In 3 Schritten startklar. Ihr Aufwand: etwa 45 Minuten."
  schritte:
    - titel: "Co-Host-Einladung"
      dauer: "10 Minuten"
      text: "Sie laden uns auf Airbnb als Co-Host mit der Berechtigung „Kalender und Postfach“ ein. Auf Booking.com legen Sie einen eigenen Benutzer für uns an. Ihre Zugangsdaten bleiben bei Ihnen."
    - titel: "Wissensbasis zu Ihrer Unterkunft"
      dauer: "30 Minuten"
      text: "Wir schicken Ihnen einen Fragebogen: Check-in, Hausregeln, WLAN, Parken, Ansprechpartner vor Ort. Daraus entsteht die Grundlage für jede Antwort."
    - titel: "Wir übernehmen"
      dauer: "ab dem vereinbarten Tag"
      text: "Wir beantworten alle Nachrichten. Sie bekommen eine tägliche Zusammenfassung und werden nur bei Dingen gefragt, die Ihre Entscheidung brauchen."

leistungen:
  titel: "Was wir für Sie übernehmen"
  karten:
    - titel: "Antworten von {start} bis {ende} Uhr"
      text: "Jeden Tag, auch am Wochenende und an Feiertagen. Keine Nachricht bleibt liegen."
    - titel: "Check-in-Kommunikation"
      text: "Anreiseinfos zum richtigen Zeitpunkt, Rückfragen zur Schlüsselübergabe, Erinnerung vor dem Check-out."
    - titel: "Notfälle an Ihre Partner vor Ort"
      text: "Wasserschaden, Stromausfall, ausgesperrte Gäste: Wir informieren sofort Ihre hinterlegte Hausmeisterin, Reinigung oder Sie selbst. Nach festem Ablauf."
    - titel: "Nachkontakt nach der Abreise"
      text: "Am Abreisetag bedanken wir uns persönlich und fragen nach einer Bewertung. Fehlt sie nach einigen Tagen, erinnern wir einmal freundlich."
    - titel: "Bewertungsmanagement"
      text: "Wir beantworten jede Bewertung in Ihrem Namen, gute wie kritische. Kritik melden wir Ihnen sofort, damit Sie reagieren können."
    - titel: "KI-gestützt, von Menschen kontrolliert"
      text: "Eine KI schreibt Entwürfe auf Basis Ihrer Wissensbasis. Jede kritische Antwort, etwa zu Geld, Stornierung, Beschwerde oder Notfall, prüft ein Mensch vor dem Versand."
    - titel: "Tägliche Zusammenfassung und Monatsbericht"
      text: "Jeden Abend eine E-Mail: was gefragt wurde, was wir geantwortet haben, was offen ist. Einmal im Monat: was Gäste in Bewertungen loben und was sie stört."

vergleich:
  titel: "Ganz nach Ihren Bedürfnissen."
  intro: "Sie entscheiden, was Sie selbst machen und was Sie abgeben. Stellen Sie Ihr Wunschpaket zusammen, auch unterschiedlich für einzelne Objekte. Wir schicken Ihnen ein passendes Angebot."

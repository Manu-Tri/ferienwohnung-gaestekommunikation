  #     name: "Thomas R."
  #     ort: "Traben-Trarbach"
  #     objekte: "1 Ferienwohnung"
  #     beispiel: true
  #   - zitat: "Die Antworten klingen wirklich nach mir, nur freundlicher. Unsere Gäste merken keinen Unterschied, außer dass sie schneller eine Antwort bekommen."
  #     name: "Familie Weber"
  #     ort: "Cochem"
  #     objekte: "2 Ferienwohnungen"

infomappe:
  datei: "anytime-infomappe.pdf"
  titel: "Wir antworten Ihren Gästen. Sie haben frei."
  untertitel: "Gästebetreuung für Ferienwohnungen auf Airbnb und Booking.com"
  einleitung: "Gästefragen kommen gern beim Abendessen, am Sonntag oder im Urlaub. Wir übernehmen diese Nachrichten für Sie, von der ersten Anfrage bis zur Bewertung, und schreiben so, wie Sie selbst schreiben würden. Sie bekommen abends eine kurze Zusammenfassung und haben bei uns eine feste Ansprechperson."
  leistungen_titel: "Was wir für Sie übernehmen"
  ablauf_titel: "So starten Sie"
  preis_titel: "So rechnen wir ab"
  preis_zeile: "pro Buchung. Keine Grundgebühr, monatlich kündbar, die ersten {test_tage} Tage kostenlos."
  steckbrief_titel: "Ihr Wohnungs-Steckbrief"
  steckbrief_einleitung: "Füllen Sie den Steckbrief einfach direkt in diesem PDF aus, speichern Sie ihn und senden Sie ihn an {email}. Gedruckt und ausgefüllt als Foto geht auch. Nur Name und E-Mail sind Pflicht."
  online_titel: "Lieber online?"
  online_text: "Den Steckbrief können Sie auch bequem auf unserer Website ausfüllen:"
  rueckweg_text: "Oder ausgefüllt zurück an: {email}"
  abschluss_text: "Vielen Dank! Bitte senden Sie den ausgefüllten Steckbrief an {email}."
  kontakt_titel: "Fragen? Wir sind für Sie da."
  email_betreff: "Ihre Infomappe von {marke}: So betreuen wir Ihre Gäste"
  email_text: |
    Guten Tag [ANREDE UND NAME],

    vielen Dank für Ihr Interesse an {marke}. Im Anhang finden Sie unsere Infomappe: Darin steht, was wir für Sie und Ihre Gäste übernehmen, wie der Start abläuft und was es kostet.

    Auf den letzten Seiten finden Sie Ihren Wohnungs-Steckbrief. Damit lernen wir Ihre Unterkunft kennen und können Ihre Gäste vom ersten Tag an so betreuen, als wären Sie selbst da. Sie können ihn direkt im PDF ausfüllen und an diese Adresse zurücksenden.

    Lieber online? Dann füllen Sie den Steckbrief hier aus:
    {steckbrief_link}

    Was Sie gerade nicht wissen, klären wir gern in einem kurzen Telefonat. Die ersten {test_tage} Tage sind kostenlos und unverbindlich.

    Herzliche Grüße
    [IHR NAME]
    {marke}
    {telefon}


# =====================================================================
# ZENTRALE INHALTSDATEI
# Hier stehen alle Texte, Preise, Zeiten und Links der Website.
#
# So ändern Sie Inhalte:
# 1. Text zwischen den Anführungszeichen ändern. Einrückung (Leerzeichen
#    am Zeilenanfang) bitte genau so lassen.
# 2. Speichern. Beim nächsten Build (oder automatisch auf Netlify)
#    ist die Änderung online. Ist die Datei fehlerhaft, bricht der Build
#    mit einer verständlichen Meldung ab und die alte Seite bleibt online.
#
# Variablen in geschweiften Klammern werden automatisch ersetzt:
#   {marke} {preis} {start} {ende} {antwortzeit} {test_tage}
#   {gp_preis} {gp_monate} {gp_plaetze} {check_stunden}
#   {verbesserungen} {region} {email} {antwort_frist}
# Wenn Sie also unten den Preis ändern, ändert er sich überall.
#
# Eckige Klammern wie [MARKENNAME] sind offene Platzhalter.
# Liste aller offenen Platzhalter: im Terminal "npm run platzhalter".
#
# Bitte keine Gedankenstriche verwenden. Prüfung: "npm run pruefen:striche".
# =====================================================================

marke:
  name: "[MARKENNAME]"
  # Vollständige Adresse der Website, ohne Schrägstrich am Ende
  domain: "https://www.example.de"
  email: "[E-MAIL-ADRESSE]"
  telefon: "[TELEFONNUMMER]"
  ort: "[ORT]"
  # Region, die auf der Startseite genannt wird
  region: "[REGION, z. B. Mosel, Eifel, Nordsee]"
  # Regionen für Suchmaschinen (strukturierte Daten "areaServed")
  einsatzgebiet:
    - "Deutschland"

service:
  start_uhr: 7
  ende_uhr: 23
  antwortzeit_minuten: 15
  # Wie schnell melden Sie sich nach einer Testanfrage?
  antwort_frist: "[24 Stunden]"

preise:
  pro_buchung: 9
  test_tage: 30
  gruenderpreis:
    pro_buchung: 6
    monate: 12
    plaetze_gesamt: 10
    # Freie Plätze. Nur von Hand pflegen. Leer lassen = kein Zähler sichtbar.
    # Beispiel:  plaetze_frei: 7
    plaetze_frei:
    erinnerung_vorher: "[4 Wochen]"

lead_magnet:
  check_stunden: 48
  verbesserungen: 5

links:
  # Link zur Terminbuchung (z. B. Cal.com, Calendly). Wird nur als Link geöffnet.
  buchungslink: "[BUCHUNGSLINK]"
  buchungsanbieter: "[ANBIETER DER TERMINBUCHUNG]"

formular:
  # "netlify" = Netlify Forms (Standard). "extern" = anderer Formulardienst,
  # dann unten die Adresse eintragen, an die das Formular gesendet wird.
  anbieter: "netlify"
  endpunkt: ""
  name: "anfrage"

analytics:
  # true = cookieloses Plausible einbinden. Absatz in der Datenschutz-
  # erklärung erscheint dann automatisch.
  plausible: false
  plausible_domain: "www.example.de"

seo:
  titel: "Gästekommunikation für Ferienwohnungen | Jede Nachricht beantwortet | {marke}"
  beschreibung: "Wir beantworten alle Gästenachrichten auf Airbnb und Booking.com von {start} bis {ende} Uhr. {preis} € pro Buchung, ohne Grundgebühr, {test_tage} Tage kostenlos testen."


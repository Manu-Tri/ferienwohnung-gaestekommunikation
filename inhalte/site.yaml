#    - zitat: "..."
#      name: "Vorname N."
#      ort: "Bernkastel-Kues"
#      objekte: "3 Ferienwohnungen"
ergebnisse:
  titel: "Ergebnisse unserer Kunden"
  kennzahlen: []
  # Nur echte Stimmen mit dokumentierter Einwilligung eintragen. Leer = Abschnitt und Menüpunkt ausgeblendet.
  stimmen: []
  # Frühere Mustertexte (ausgedacht, nicht veröffentlichen):
